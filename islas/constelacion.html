<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111c38"><title>Isla V · Nuestra constelación</title><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=DM+Sans:wght@400;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 65% 38%,#233e65,#111c38 65%,#090f24);color:#f9ecd4;font-family:'DM Sans',sans-serif;overflow-x:hidden}a.back{position:absolute;top:18px;left:16px;color:#f8e3bc;border:1px solid #e9d19a70;border-radius:25px;padding:11px 16px;text-decoration:none;font-size:12px;z-index:3}main{max-width:820px;margin:auto;padding:84px 16px 70px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.2em;color:#e8c994;text-transform:uppercase}h1{font:700 clamp(49px,11vw,84px)/1 'Cormorant Garamond',serif;margin:12px 0}p.lead{font:24px/1.35 'Cormorant Garamond',serif;max-width:540px;margin:0 auto 20px}.sky{position:relative;width:min(100%,680px);aspect-ratio:1.15;margin:25px auto;border:1px solid #d3c28c70;border-radius:50% 50% 9px 9px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#304b70,#0d1935 75%);box-shadow:0 0 55px #6e85bb22,inset 0 0 60px #040b22}.sky:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff2d2 1px,transparent 1px);background-size:37px 53px;opacity:.36;animation:twinkle 7s ease-in-out infinite alternate}.sky:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,#b9b5eb22,transparent 35%);pointer-events:none}.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.lines line{stroke:#f5d89a;stroke-width:1.3;stroke-dasharray:4 3;opacity:.75}.star{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;border:1px solid #f1d99a88;background:#273c61;color:#ffe4a0;font-size:29px;cursor:pointer;box-shadow:0 0 16px #f2d48b55;z-index:2}.star.done{background:#f2d9a5;color:#493825;box-shadow:0 0 25px 7px #f2d48b80}.star:focus-visible{outline:3px solid white;outline-offset:3px}.star:disabled{cursor:default}.star:disabled:not(.done){opacity:.55}.panel{margin:25px auto;max-width:540px;min-height:150px;background:#f6e8cb;color:#483524;border-radius:5px;padding:20px 25px;box-shadow:0 14px 35px #0005}.panel h2{font:700 37px 'Cormorant Garamond',serif;margin:5px}.panel p{font:23px/1.35 'Cormorant Garamond',serif;margin:8px}.progress{font-size:12px;color:#e8c994}.finish{background:#ebcd93;color:#38271c;border:0;border-radius:26px;padding:14px 25px;font-weight:700;cursor:pointer}.hidden{display:none!important}.meteor{position:absolute;left:75%;top:-20%;width:2px;height:90px;background:linear-gradient(transparent,#ffdfab);transform:rotate(35deg);animation:meteor 7s ease-in infinite;opacity:0;pointer-events:none}@keyframes meteor{10%{opacity:.8}20%,100%{transform:translate(-330px,400px) rotate(35deg);opacity:0}}@keyframes twinkle{to{opacity:.18}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.meteor{display:none}}</style></head><body><a class="back" href="../index.html">← Volver al mapa</a><main><div class="eyebrow">Capítulo V · El cielo de nuestros sueños</div><h1>Nuestra constelación</h1><p class="lead">Amorcito, enciende nuestros sueños. ✨</p><p id="progress" class="progress" role="status">0 de 5 estrellas encendidas</p><div class="sky" id="sky" aria-label="Constelación interactiva de cinco estrellas"><svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" id="lines"></svg><div class="meteor" aria-hidden="true"></div><button class="star" style="left:17%;top:70%" data-n="0" aria-label="Primera estrella: acompañarnos">✧</button><button class="star" style="left:35%;top:36%" data-n="1" aria-label="Segunda estrella: descubrir" disabled>✧</button><button class="star" style="left:53%;top:59%" data-n="2" aria-label="Tercera estrella: construir" disabled>✧</button><button class="star" style="left:75%;top:26%" data-n="3" aria-label="Cuarta estrella: celebrar" disabled>✧</button><button class="star" style="left:83%;top:72%" data-n="4" aria-label="Quinta estrella: elegirnos" disabled>✧</button></div><section class="panel" id="panel" aria-live="polite"><h2>Una estrella a la vez</h2><p>Comienza tocando la primera estrella iluminada.</p></section><button id="finish" class="finish hidden">Guardar nuestros sueños ✦</button></main><script>'use strict';const stars=[...document.querySelectorAll('.star')],lines=document.getElementById('lines'),panel=document.getElementById('panel');const memories=[['Acompañarnos','Siempre juntitos, incluso en días difíciles.'],['Descubrir','Muchos viajes contigo. ♥'],['Construir','Construir algo bonito juntos.'],['Celebrar','Celebrar hasta lo más pequeñito.'],['Elegirnos','Te elegiría mil veces, amorcito.']];let current=0;stars.forEach((b,i)=>b.onclick=()=>{if(i!==current)return;b.disabled=true;b.classList.add('done');b.textContent='★';if(i>0){const a=stars[i-1],c=stars[i],line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',parseFloat(a.style.left));line.setAttribute('y1',parseFloat(a.style.top));line.setAttribute('x2',parseFloat(c.style.left));line.setAttribute('y2',parseFloat(c.style.top));lines.append(line)}panel.replaceChildren();const title=document.createElement('h2'),body=document.createElement('p');title.textContent=memories[i][0];body.textContent=memories[i][1];panel.append(title,body);current++;document.getElementById('progress').textContent=current+' de 5 estrellas encendidas';if(current<stars.length)stars[current].disabled=false;else document.getElementById('finish').classList.remove('hidden')});document.getElementById('finish').onclick=()=>{localStorage.setItem('lucero-isla-suenos-v1','complete');location.href='../index.html?isla=5'};</script></body></html>
