<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2d3b"><title>Isla IV · Nuestra travesía</title><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=DM+Sans:wght@400;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 65% 20%,#396c73,#103443 58%,#091f2c);color:#f8e9cc;font-family:'DM Sans',sans-serif}.back{position:absolute;top:20px;left:16px;border:1px solid #e9c9927a;padding:11px 15px;border-radius:24px;color:#f7e5c4;text-decoration:none;font-size:12px}main{max-width:850px;margin:auto;padding:80px 16px 65px;text-align:center}.eyebrow{color:#ebc48b;letter-spacing:.18em;text-transform:uppercase;font-size:11px}h1{font:700 clamp(49px,11vw,83px)/1 'Cormorant Garamond',serif;margin:12px 0}p.lead{font:24px/1.3 'Cormorant Garamond',serif;max-width:560px;margin:0 auto 20px}.chart{position:relative;margin:26px auto 18px;width:min(100%,700px);aspect-ratio:1.35;border:9px solid #9b774f;box-shadow:0 22px 55px #001b;overflow:hidden;border-radius:5px;background:radial-gradient(ellipse at 65% 40%,#f7e8c5,#dbc29a)}.chart svg{width:100%;height:100%;display:block}.spot{position:absolute;transform:translate(-50%,-50%);width:clamp(43px,9vw,57px);height:clamp(43px,9vw,57px);border:2px solid #9a713f;border-radius:50%;background:#f5e6c3;color:#533f2a;font-size:23px;box-shadow:0 3px 10px #3a281a44;cursor:pointer;transition:transform .25s}.spot:focus-visible{outline:3px solid #185b65;outline-offset:3px}.spot.done{background:#356c60;color:#fff2d6;border-color:#e7c787}.spot:active{transform:translate(-50%,-50%) scale(.94)}.ship{position:absolute;left:14%;top:75%;font-size:clamp(25px,5vw,40px);transform:translate(-50%,-50%);pointer-events:none;transition:left .9s ease,top .9s ease;filter:drop-shadow(0 4px 3px #0018)}.panel{background:#f4e6c8;color:#4b3826;border-radius:5px;box-shadow:0 10px 30px #0005;max-width:550px;margin:22px auto;padding:22px 25px;min-height:180px}.panel h2{font:700 36px 'Cormorant Garamond',serif;margin:5px}.panel p{font:22px/1.3 'Cormorant Garamond',serif}.small{font:12px/1.5 'DM Sans',sans-serif!important}.btn{border:0;border-radius:25px;background:#244e4e;color:#fff1d7;padding:13px 22px;font-weight:700;min-height:45px;cursor:pointer}.btn:disabled{opacity:.5;cursor:default}.finish{background:#d6b47c;color:#3d2c1d}.progress{color:#e8c895;font-size:12px}.hidden{display:none!important}.wave{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(165deg,transparent 0 50px,#fff8e31c 52px 54px,transparent 57px 100px);animation:wave 13s ease-in-out infinite alternate}@keyframes wave{to{transform:translate(20px,-12px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style><style id="visual-first">main>p,main>.lead,main>.eyebrow{display:none!important} .panel{min-height:0!important} .panel p{display:none!important}</style></head><body><a class="back" href="../index.html">← Volver al mapa</a><main><h1>Nuestra travesía</h1><p class="progress" id="progress" role="status">0 de 3 destinos descubiertos</p><div class="chart" aria-label="Carta náutica interactiva con tres destinos"><svg viewBox="0 0 700 520" aria-hidden="true"><defs><pattern id="water" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M0 15 Q9 7 18 15 T36 15" fill="none" stroke="#6e9b9a" stroke-width="1.4" opacity=".45"/></pattern></defs><rect width="700" height="520" fill="#d4d6b7"/><rect width="700" height="520" fill="url(#water)"/><path d="M-20 100 Q90 35 180 95 T250 240 Q195 310 100 265 T-20 310Z" fill="#b9b58a" stroke="#f3e3bb" stroke-width="10"/><path d="M480 -30 Q570 60 670 25 L740 90 740 320 Q640 340 560 250 T480 -30Z" fill="#b9b58a" stroke="#f3e3bb" stroke-width="10"/><path d="M260 490 Q300 385 380 405 T490 540Z" fill="#b9b58a" stroke="#f3e3bb" stroke-width="10"/><path d="M95 390 Q240 275 350 260 T545 135" fill="none" stroke="#9c7649" stroke-width="5" stroke-dasharray="3 15" stroke-linecap="round"/><g fill="#826340" font-family="serif" font-size="20" opacity=".8"><text x="45" y="160">MAR DE LOS RECUERDOS</text><text x="410" y="455">✧  ✧  ✧</text><text x="300" y="65">N</text></g><g stroke="#977448" fill="none" stroke-width="2" transform="translate(300 92)"><circle r="24"/><path d="M0 -34V34M-34 0H34M-20 -20L20 20M20 -20L-20 20"/></g></svg><div class="wave"></div><button class="spot" style="left:22%;top:66%" data-step="0" aria-label="Primera parada, el valor de comenzar">⚓</button><button class="spot" style="left:50%;top:49%" data-step="1" aria-label="Segunda parada, enfrentar las tormentas" disabled>🌧</button><button class="spot" style="left:78%;top:26%" data-step="2" aria-label="Tercera parada, el horizonte compartido" disabled>☀</button><div class="ship" id="ship" aria-hidden="true">⛵</div></div><section class="panel" id="panel" aria-live="polite"><h2>⚓</h2></section><button class="btn finish hidden" id="finish">Guardar esta aventura ✦</button></main><script>'use strict';const spots=[...document.querySelectorAll('.spot')],panel=document.getElementById('panel'),ship=document.getElementById('ship'),progress=document.getElementById('progress');let step=0;const chapters=[['El valor de zarpar','⚓'],['Incluso en las tormentas','🌊'],['El horizonte es nuestro','☀️']];spots.forEach((b,i)=>b.onclick=()=>{if(i!==step)return;b.classList.add('done');b.disabled=true;ship.style.left=b.style.left;ship.style.top=b.style.top;const [title,message]=chapters[i];panel.innerHTML='<h2></h2>';panel.querySelector('h2').textContent=title;step++;progress.textContent=step+' de 3 destinos descubiertos';if(step<3)spots[step].disabled=false;else document.getElementById('finish').classList.remove('hidden')});document.getElementById('finish').onclick=()=>{localStorage.setItem('lucero-isla-aventuras-v1','complete');location.href='../index.html?isla=4'};</script></body></html>
