</main><script>
'use strict';
const stops=[
{x:175,y:640,title:'El inicio',emoji:'⚓',story:'Toda gran aventura comienza con un instante pequeño. Y, sin saberlo, aquel día empezó una de las historias más bonitas de mi vida.',note:'Aquí pondremos nuestro primer recuerdo.'},
{x:400,y:430,title:'El encuentro',emoji:'🌸',story:'Entre tantas rutas posibles, la vida encontró una forma de cruzar la tuya con la mía. Todavía me alegra que haya sido así.',note:'Aquí irá la historia de cómo nos conocimos.'},
{x:650,y:605,title:'Los momentos',emoji:'📸',story:'Hay días que parecen normales hasta que los recuerdas contigo. Entonces se vuelven extraordinarios.',note:'Aquí añadiremos nuestras fotografías favoritas.'},
{x:900,y:370,title:'Las tormentas',emoji:'⛈️',story:'No todas las aguas son tranquilas. Pero incluso cuando el mar se agita, me gusta saber que seguimos aprendiendo a navegar juntos.',note:'Una promesa para los días difíciles.'},
{x:1120,y:500,title:'Los sueños',emoji:'✨',story:'Me emociona todo lo que aún no hemos vivido: los lugares, las risas, los planes y esa vida que seguimos construyendo.',note:'Aquí pondremos los sueños que compartimos.'},
{x:1210,y:230,title:'Nuestro tesoro',emoji:'💍',story:'Amorcito, mi tesoro eres tú. Te amo. ♥',note:'Siempre tuyo ♥'}
];
const $=id=>document.getElementById(id),world=$('world'),viewport=$('viewport'),dialog=$('dialog'),visited=new Set(JSON.parse(localStorage.getItem('lucero-islas-v1')||'[]').filter(n=>Number.isInteger(n)&&n>=0&&n<5));let scale=1,tx=0,ty=0,active=0,audio=null,soundOn=false,drag=null,moved=false;
const shapes=$('islands');stops.forEach((s,i)=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','island');g.setAttribute('transform','translate('+s.x+' '+s.y+')');g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label','Isla '+(i+1)+': '+s.title);g.innerHTML='<use href="#coast" class="shore" transform="scale(1.15)"/><use href="#coast" class="land"/><use href="#coast" class="inner" transform="scale(.76)"/><text x="0" y="-15" font-size="44" text-anchor="middle">'+s.emoji+'</text><circle class="pin" cx="0" cy="52" r="23"/><text class="num" x="0" y="53">'+(i+1)+'</text><rect class="tag" x="-110" y="91" width="220" height="42" rx="6"/><text class="name" x="0" y="120">'+s.title+'</text>';g.addEventListener('click',()=>{if(!moved)openStop(i)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openStop(i)}});shapes.append(g)});
function fit(){const w=viewport.clientWidth,h=viewport.clientHeight;scale=Math.min(w/1400,h/900)*.91;scale=Math.max(.35,scale);tx=(w-1400*scale)/2;ty=(h-900*scale)/2;render()}
function render(){world.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'}
function zoom(f,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){const old=scale;scale=Math.max(.32,Math.min(2.5,scale*f));tx=cx-(cx-tx)*scale/old;ty=cy-(cy-ty)*scale/old;render()}
$('plus').onclick=()=>zoom(1.25);$('minus').onclick=()=>zoom(.8);$('reset').onclick=fit;viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoom(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let pointers=new Map(),lastDistance=0;viewport.addEventListener('pointerdown',e=>{if(!dialog.hidden||!$('intro').hidden)return;viewport.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY};moved=false});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;tx+=dx;ty+=dy;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8)moved=true;render()}else if(pointers.size===2){const pts=[...pointers.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(lastDistance)zoom(d/lastDistance,(pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2);lastDistance=d;moved=true}});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)lastDistance=0;setTimeout(()=>moved=false,80)}viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function update(){if(localStorage.getItem('lucero-isla-encuentro-v1')==='complete')visited.add(0);if(localStorage.getItem('lucero-isla-recuerdos-v1')==='complete')visited.add(2);if(localStorage.getItem('lucero-isla-ruta-v1')==='complete')visited.add(1);if(localStorage.getItem('lucero-isla-aventuras-v1')==='complete')visited.add(3);if(localStorage.getItem('lucero-isla-suenos-v1')==='complete')visited.add(4);localStorage.setItem('lucero-islas-v1',JSON.stringify([...visited]));const n=visited.size;$('progress').textContent=n+' de 5 recuerdos descubiertos';$('next').textContent=n===5?'Abrir el tesoro ✨':'Continuar viaje →'}
let sailing=false;function sailTo(i,path){if(sailing)return;sailing=true;const destination=stops[i],ship=$('ship'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;ship.style.transition=reduced?'none':'left 1.3s ease-in-out,top 1.3s ease-in-out';ship.style.left=destination.x+'px';ship.style.top=destination.y+'px';toast('⛵ Navegando hacia '+destination.title+'...');setTimeout(()=>{location.href=path},reduced?80:1400)}function openStop(i){if(i===0){sailTo(i,'islas/encuentro.html');return}if(i===1){sailTo(i,'islas/ruta-corazon.html');return}if(i===2){sailTo(i,'islas/recuerdos.html');return}if(i===3){sailTo(i,'islas/aventuras.html');return}if(i===4){sailTo(i,'islas/constelacion.html');return}if(i===5&&visited.size<5){toast('Primero descubre las cinco islas de nuestra historia ✨');return}if(i===5){sailTo(i,'islas/tesoro.html');return}active=i;const s=stops[i];$('ship').style.left=s.x+'px';$('ship').style.top=s.y+'px';$('emoji').textContent=s.emoji;$('counter').textContent=i===5?'EL TESORO FINAL':'ISLA '+(i+1)+' DE 6';$('dialogtitle').textContent=s.title;$('story').textContent=s.story;$('footnote').textContent=s.note;$('continue').textContent=i===5?'Volver al mapa':'Siguiente isla →';dialog.hidden=false;if(i<5){visited.add(i);localStorage.setItem('lucero-islas-v1',JSON.stringify([...visited]));update()}chime()}
function nextStop(){for(let i=0;i<5;i++)if(!visited.has(i))return openStop(i);openStop(5)}
$('next').onclick=nextStop;$('continue').onclick=()=>{dialog.hidden=true;if(active<5)nextStop()};$('close').onclick=()=>dialog.hidden=true;dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape'&& !dialog.hidden)dialog.hidden=true});
function chime(){if(!soundOn)return;const ctx=audio||(audio=new (window.AudioContext||window.webkitAudioContext)());if(ctx.state==='suspended')ctx.resume();[523,659,784].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.055,ctx.currentTime+i*.12+.03);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.12+.55);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+i*.12);o.stop(ctx.currentTime+i*.12+.6)})}
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').textContent=soundOn?'♪':'♫';toast(soundOn?'Efectos de sonido activados':'Sonido desactivado');if(soundOn)chime()};
$('start').onclick=()=>{$('intro').hidden=true;toast('Tu aventura comienza aquí. ¡Toca una isla!');chime()};window.addEventListener('resize',fit);fit();update();if(new URLSearchParams(location.search).has('isla')){history.replaceState(null,'',location.pathname);toast('¡Recuerdo guardado en nuestra bitácora! ♥')}
</script></body></html>
